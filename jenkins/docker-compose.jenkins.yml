version: "3.9"

# Run Jenkins locally in Docker — for local development
# Usage: docker-compose -f jenkins/docker-compose.jenkins.yml up -d

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-autodeploy
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"      # Jenkins UI
      - "50000:50000"    # Agent port
    volumes:
      - jenkins_data:/var/jenkins_home
      # Mount Docker socket so Jenkins can run Docker commands
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    networks:
      - jenkins-net

  # Optional: Jenkins agent
  jenkins-agent:
    image: jenkins/inbound-agent:latest
    container_name: jenkins-agent
    restart: unless-stopped
    depends_on:
      - jenkins
    environment:
      JENKINS_URL: "http://jenkins:8080"
      JENKINS_AGENT_NAME: "docker-agent"
      JENKINS_SECRET: "${JENKINS_AGENT_SECRET:-changeme}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-net

volumes:
  jenkins_data:
    name: jenkins-autodeploy-data

networks:
  jenkins-net:
    driver: bridge
    name: jenkins-network
