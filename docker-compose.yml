version: "3.9"

services:
  # ── Web Application ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - BUILD_NUMBER=${BUILD_NUMBER:-local}
    image: autodeploy-app:${APP_VERSION:-latest}
    container_name: autodeploy-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - autodeploy-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  autodeploy-net:
    driver: bridge
    name: autodeploy-network
